<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Team Task Manager</title>
    <meta name="description" content="A collaborative team task management application. Create projects, assign tasks, and track progress with role-based access control.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- App Shell -->
        <nav id="sidebar" class="sidebar hidden">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="2" y="2" width="10" height="10" rx="3" fill="url(#g1)" opacity="0.9"/>
                        <rect x="16" y="2" width="10" height="10" rx="3" fill="url(#g1)" opacity="0.6"/>
                        <rect x="2" y="16" width="10" height="10" rx="3" fill="url(#g1)" opacity="0.6"/>
                        <rect x="16" y="16" width="10" height="10" rx="3" fill="url(#g1)" opacity="0.3"/>
                        <defs>
                            <linearGradient id="g1" x1="0" y1="0" x2="28" y2="28">
                                <stop stop-color="#7c5cfc"/>
                                <stop offset="1" stop-color="#00d4ff"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="brand-name">TaskFlow</span>
            </div>
            <div class="sidebar-nav">
                <a href="#/dashboard" class="nav-link" data-page="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="#/projects" class="nav-link" data-page="projects">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <span>Projects</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info" id="user-info">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="user-name">User</span>
                        <span class="user-email" id="user-email">user@mail.com</span>
                    </div>
                </div>
                <button class="btn-logout" id="btn-logout" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </nav>

        <main id="main-content" class="main-content">
            <!-- Pages rendered here by JS -->
        </main>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-container" class="modal-container">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
